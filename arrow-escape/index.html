<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arrow Escape</title>
<style>
  html,body{margin:0;height:100%;background:#1f1b3a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const W = 420, H = 760;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2); vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr; cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw / W, vh / H); ox = (vw - W * scale) / 2; oy = (vh - H * scale) / 2;
}
addEventListener('resize', resize); resize();
const toGame = e => ({ x: (e.clientX - ox) / scale, y: (e.clientY - oy) / scale });
const EXT = () => ({ x: -ox / scale - 2, y: -oy / scale - 2, w: vw / scale + 4, h: vh / scale + 4 });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(t, x, y, size, color, align = 'center', stroke = null, weight = 900) {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size * 0.18; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function star(x, y, r, on) {
  ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = on ? '#ffc93c' : 'rgba(0,0,0,0.12)'; ctx.fill(); if (on) { ctx.strokeStyle = '#e09b00'; ctx.lineWidth = 3; ctx.stroke(); }
}
function heart(x, y, s, on) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
  ctx.moveTo(0, 6); ctx.bezierCurveTo(-12, -3, -7, -13, 0, -6); ctx.bezierCurveTo(7, -13, 12, -3, 0, 6); ctx.closePath();
  ctx.fillStyle = on ? '#ff4d6d' : 'rgba(255,255,255,0.18)'; ctx.fill(); ctx.restore();
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- save & sound ----------
let save = { level: 1, hints: 3, muted: false };
try { const s = JSON.parse(localStorage.getItem('arrowescape_v1') || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem('arrowescape_v1', JSON.stringify(save)); } catch (e) {} };
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); }
function tone(f, d = 0.1, type = 'sine', v = 0.12, slide = 0, delay = 0) {
  if (save.muted || !actx) return; const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
let swooshPitch = 0;
const SFX = {
  swoosh: () => { tone(500 + swooshPitch * 40, 0.12, 'triangle', 0.1, 500); swooshPitch = Math.min(swooshPitch + 1, 20); },
  bump: () => tone(140, 0.18, 'square', 0.08, -60), win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, 'triangle', 0.12, 0, i * 0.08)),
  fail: () => [392, 330, 262].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, 0, i * 0.12)), click: () => tone(880, 0.05, 'square', 0.05),
};
const buzz = ms => { try { if (!save.muted && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

// ---------- level generation ----------
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up right down left
const DCOL = [['#5b8cff', '#3a64d8'], ['#ff8a3d', '#e2641b'], ['#2fcf8a', '#16a368'], ['#c86bff', '#9b3fe0']];
let N = 4, grid = [], arrows = [], hearts = 3, state = 'play', overlayT = 0, time = 0, moves = 0, hint = null, particles = [], hits = [];

function gridSize(l) { return Math.min(10, 4 + Math.floor((l - 1) / 3)); }
function pathClear(g, x, y, d) {
  let cx = x + DIRS[d][0], cy = y + DIRS[d][1];
  while (cx >= 0 && cy >= 0 && cx < N && cy < N) { if (g[cy][cx] >= 0) return false; cx += DIRS[d][0]; cy += DIRS[d][1]; }
  return true;
}
function buildLevel() {
  N = gridSize(save.level);
  const R = rng(save.level * 7919 + 13);
  const g = Array.from({ length: N }, () => Array(N).fill(-1));
  const density = Math.min(0.92, 0.62 + save.level * 0.01);
  const target = Math.floor(N * N * density);
  let placed = 0, tries = 0;
  // each new arrow's escape path must be clear of arrows already placed,
  // so removing them in reverse order always works: every level is solvable.
  while (placed < target && tries < 6000) {
    tries++;
    const x = Math.floor(R() * N), y = Math.floor(R() * N);
    if (g[y][x] >= 0) continue;
    const order = [0, 1, 2, 3].sort(() => R() - 0.5);
    for (const d of order) if (pathClear(g, x, y, d)) { g[y][x] = d; placed++; break; }
  }
  grid = g; arrows = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (g[y][x] >= 0) arrows.push({ x, y, d: g[y][x], out: false, t: 0, bump: 0, bumpDist: 0, pop: 0 });
  hearts = 3; moves = 0; hint = null; state = 'play'; overlayT = 0; swooshPitch = 0; particles = [];
}
buildLevel();

// ---------- layout ----------
const BOARD = 384, BX = (W - BOARD) / 2, BY = 190;
const cell = () => BOARD / N;

function tapCell(cx, cy) {
  if (state !== 'play') return;
  const a = arrows.find(a => !a.out && a.x === cx && a.y === cy);
  if (!a || a.bump > 0) return;
  moves++; hint = null;
  if (pathClear(grid, a.x, a.y, a.d)) {
    a.out = true; a.t = 0; grid[a.y][a.x] = -1; SFX.swoosh(); buzz(10);
    if (arrows.every(b => b.out)) setTimeout(() => { state = 'win'; overlayT = 0; SFX.win(); save.level++; if ((save.level - 1) % 3 === 0) save.hints++; persist(); }, 450);
  } else {
    let k = 0, cx2 = a.x + DIRS[a.d][0], cy2 = a.y + DIRS[a.d][1];
    while (grid[cy2] && grid[cy2][cx2] === -1) { k++; cx2 += DIRS[a.d][0]; cy2 += DIRS[a.d][1]; }
    a.bump = 1; a.bumpDist = k + 0.25; hearts--; SFX.bump(); buzz(80); swooshPitch = 0;
    if (hearts <= 0) setTimeout(() => { state = 'fail'; overlayT = 0; SFX.fail(); }, 400);
  }
}
function useHint() {
  if (state !== 'play' || save.hints <= 0 || hint) return;
  const a = arrows.find(a => !a.out && pathClear(grid, a.x, a.y, a.d));
  if (a) { hint = a; save.hints--; persist(); SFX.click(); }
}

cv.addEventListener('pointerdown', e => {
  audio(); const p = toGame(e);
  for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) { h.fn(); return; } }
  if (state === 'play' && p.x >= BX && p.x < BX + BOARD && p.y >= BY && p.y < BY + BOARD) tapCell(Math.floor((p.x - BX) / cell()), Math.floor((p.y - BY) / cell()));
});
addEventListener('keydown', e => { audio(); if ((e.key === ' ' || e.key === 'Enter') && state !== 'play' && overlayT > 0.5) buildLevel(); if (e.key === 'h') useHint(); });

// ---------- update / draw ----------
function update(dt) {
  time += dt; overlayT += dt;
  for (const a of arrows) {
    if (a.out) a.t += dt;
    if (a.bump > 0) a.bump = Math.max(0, a.bump - dt / 0.35);
  }
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); particles = particles.filter(p => p.life > 0);
}

function drawArrow(px, py, s, d, colors, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(px + s * 0.08, py + s * 0.12, s * 0.84, s * 0.84, s * 0.2); ctx.fill();
  const g = ctx.createLinearGradient(0, py, 0, py + s); g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);
  ctx.fillStyle = g; rr(px + s * 0.08, py + s * 0.06, s * 0.84, s * 0.84, s * 0.2); ctx.fill();
  ctx.save(); ctx.translate(px + s / 2, py + s * 0.48); ctx.rotate(d * Math.PI / 2);
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(0, -s * 0.3); ctx.lineTo(s * 0.22, -s * 0.06); ctx.lineTo(s * 0.08, -s * 0.06); ctx.lineTo(s * 0.08, s * 0.28);
  ctx.lineTo(-s * 0.08, s * 0.28); ctx.lineTo(-s * 0.08, -s * 0.06); ctx.lineTo(-s * 0.22, -s * 0.06); ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.globalAlpha = 1;
}

function button(x, y, w, h, label, color, fn, o = {}) {
  const en = o.enabled !== false; ctx.save(); const pl = o.pulse ? 1 + Math.sin(time * 5) * 0.035 : 1;
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(pl, pl);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(-w / 2, -h / 2 + 4, w, h, h / 2); ctx.fill();
  ctx.fillStyle = en ? color : '#5a5577'; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; rr(-w / 2 + 5, -h / 2 + 3, w - 10, h / 2 - 3, h / 3); ctx.fill();
  text(label, 0, 1, o.size || 18, '#fff'); ctx.restore();
  hits.push({ x, y, w, h, fn: () => { if (en) { SFX.click(); fn(); } } });
}

function draw() {
  hits = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#1f1b3a'; ctx.fillRect(0, 0, vw, vh);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  const e = EXT(); const bg = ctx.createLinearGradient(0, e.y, 0, e.y + e.h); bg.addColorStop(0, '#2a2552'); bg.addColorStop(1, '#3d2f6e'); ctx.fillStyle = bg; ctx.fillRect(e.x, e.y, e.w, e.h);

  text('ARROW ESCAPE', W / 2, 52, 30, '#fff', 'center', '#5b3fd1');
  text('LEVEL ' + save.level, W / 2, 92, 20, '#ffd23f');
  for (let i = 0; i < 3; i++) heart(W / 2 - 34 + i * 34, 130, 1.4, i < hearts);
  // mute
  rr(14, 18, 44, 40, 20); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  text(save.muted ? '🔇' : '🔊', 36, 39, 18, '#fff');
  hits.push({ x: 14, y: 18, w: 44, h: 40, fn: () => { save.muted = !save.muted; persist(); } });
  // restart
  rr(W - 58, 18, 44, 40, 20); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W - 36, 38, 9, -0.3, Math.PI * 1.5); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(W - 36, 24); ctx.lineTo(W - 29, 29); ctx.lineTo(W - 37, 34); ctx.fill();
  hits.push({ x: W - 58, y: 18, w: 44, h: 40, fn: () => { SFX.click(); buildLevel(); } });

  // board
  rr(BX - 10, BY - 10, BOARD + 20, BOARD + 20, 22); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
  const s = cell();
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { rr(BX + x * s + s * 0.1, BY + y * s + s * 0.1, s * 0.8, s * 0.8, s * 0.18); ctx.fill(); }
  for (const a of arrows) {
    let px = BX + a.x * s, py = BY + a.y * s, alpha = 1;
    if (a.out) {
      const dd = a.t * 1600; px += DIRS[a.d][0] * dd; py += DIRS[a.d][1] * dd; alpha = Math.max(0, 1 - a.t * 1.8);
      if (alpha <= 0) continue;
    } else if (a.bump > 0) {
      const k = a.bump > 0.5 ? (1 - a.bump) * 2 : a.bump * 2;
      px += DIRS[a.d][0] * a.bumpDist * s * k; py += DIRS[a.d][1] * a.bumpDist * s * k;
    }
    if (hint === a) { ctx.fillStyle = `rgba(255,230,90,${0.35 + Math.sin(time * 8) * 0.25})`; rr(px - 3, py - 3, s + 6, s + 6, s * 0.25); ctx.fill(); }
    drawArrow(px, py, s, a.d, a.bump > 0 ? ['#ff6b6b', '#d63a3a'] : DCOL[a.d], alpha);
  }
  const left = arrows.filter(a => !a.out).length;
  text(left + ' arrows left · ' + moves + ' moves', W / 2, BY + BOARD + 32, 15, 'rgba(255,255,255,0.75)', 'center', null, 700);
  button(W / 2 - 100, BY + BOARD + 60, 200, 52, `HINT (${save.hints})`, '#7b61ff', useHint, { enabled: save.hints > 0 && state === 'play' });
  if (save.level <= 2 && moves === 0) text('Tap an arrow with a clear path out!', W / 2, 168, 15, '#9ff0b0', 'center', null, 800);

  if (state !== 'play') {
    const a = Math.min(1, overlayT * 3); ctx.globalAlpha = a * 0.6; ctx.fillStyle = '#100c24'; ctx.fillRect(e.x, e.y, e.w, e.h); ctx.globalAlpha = a;
    const py = 220 + (1 - a) * 30; rr(40, py, 340, 290, 28); ctx.fillStyle = '#fff'; ctx.fill();
    if (state === 'win') {
      text('LEVEL ' + (save.level - 1), W / 2, py + 46, 20, '#6a6a8a'); text('CLEARED!', W / 2, py + 86, 38, '#5b3fd1');
      for (let i = 0; i < 3; i++) star(W / 2 - 70 + i * 70, py + 150, i === 1 ? 32 : 26, i < hearts && overlayT > 0.3 + i * 0.25);
      if ((save.level - 1) % 3 === 0) text('+1 hint earned!', W / 2, py + 196, 15, '#2fae5a', 'center', null, 800);
    } else {
      text('OUT OF LIVES', W / 2, py + 70, 32, '#e74c3c'); text('Look for arrows with a clear path', W / 2, py + 120, 16, '#555', 'center', null, 700);
    }
    if (overlayT > 0.5) button(W / 2 - 110, py + 220, 220, 52, state === 'win' ? 'NEXT LEVEL' : 'TRY AGAIN', state === 'win' ? '#2fae5a' : '#7b61ff', buildLevel, { pulse: true, size: 20 });
    ctx.globalAlpha = 1;
  }
}
let last = performance.now();
function frame(now) { const dt = Math.min(0.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__game = { state: () => state, save: () => save, arrows: () => arrows, tap: tapCell, clear: (x, y, d) => pathClear(grid, x, y, d), next: buildLevel, N: () => N };
})();
</script>
</body>
</html>
