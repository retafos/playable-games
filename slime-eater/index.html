<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Slime Eater</title>
<style>
  html,body{margin:0;height:100%;background:#2d1e3a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const W = 420, H = 760, WS = 1400, ROUND = 75;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw / W, vh / H);
  ox = (vw - W * scale) / 2; oy = (vh - H * scale) / 2;
}
addEventListener('resize', resize); resize();
const toGame = e => ({ x: (e.clientX - ox) / scale, y: (e.clientY - oy) / scale });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(t, x, y, size, color, align = 'center', stroke = null, weight = 900) {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size * 0.2; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}

let best = 0;
try { best = parseFloat(localStorage.getItem('slime_best')) || 0; } catch (e) {}

// ---------- objects ----------
const COLORS = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#ff6b9a', '#2ecc71'];
const TIERS = [
  { n: 170, types: ['crumb', 'coin', 'candy'], s: [5, 7] },
  { n: 75, types: ['sock', 'block', 'ball', 'cup', 'book'], s: [9, 13] },
  { n: 36, types: ['plant', 'chair', 'lamp', 'bin'], s: [16, 24] },
  { n: 16, types: ['table', 'tv', 'armchair', 'fridge'], s: [30, 44] },
  { n: 7, types: ['sofa', 'bed', 'piano', 'car'], s: [55, 75] },
];

const DRAW = {
  crumb(s, c) { ctx.fillStyle = '#b07a3c'; [[0, 0, 0.6], [-0.5, 0.4, 0.4], [0.5, -0.3, 0.45]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, 7); ctx.fill(); }); },
  coin(s) { ctx.fillStyle = '#e09b00'; ctx.beginPath(); ctx.arc(0, 0, s, 0, 7); ctx.fill(); ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, 7); ctx.fill(); },
  candy(s, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(-s * 0.5, 0); ctx.lineTo(-s, -s * 0.5); ctx.lineTo(-s, s * 0.5); ctx.fill(); ctx.beginPath(); ctx.moveTo(s * 0.5, 0); ctx.lineTo(s, -s * 0.5); ctx.lineTo(s, s * 0.5); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.2, s * 0.2, 0, 7); ctx.fill(); },
  sock(s, c) { ctx.fillStyle = c; rr(-s * 0.35, -s, s * 0.7, s * 1.5, s * 0.3); ctx.fill(); rr(-s * 0.35, s * 0.15, s * 1.1, s * 0.6, s * 0.3); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(-s * 0.35, -s, s * 0.7, s * 0.3); },
  block(s, c) { ctx.fillStyle = c; rr(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6, s * 0.2); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.85)'; rr(-s * 0.5, -s * 0.5, s, s, s * 0.15); ctx.fill(); },
  ball(s, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, s, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.25; ctx.beginPath(); ctx.arc(0, 0, s * 0.85, -0.6, 0.6); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, s * 0.85, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke(); },
  cup(s) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 0.65, 0, s * 0.35, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, s * 0.8, 0, 7); ctx.fill(); ctx.fillStyle = '#6b3a1e'; ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, 7); ctx.fill(); },
  book(s, c) { ctx.fillStyle = c; rr(-s * 0.7, -s, s * 1.4, s * 2, s * 0.12); ctx.fill(); ctx.fillStyle = '#f5f0e6'; ctx.fillRect(s * 0.45, -s * 0.9, s * 0.18, s * 1.8); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(-s * 0.7, -s, s * 0.2, s * 2); },
  plant(s) { ctx.fillStyle = '#2e8b57'; for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; ctx.beginPath(); ctx.ellipse(Math.cos(a) * s * 0.55, Math.sin(a) * s * 0.55, s * 0.45, s * 0.25, a, 0, 7); ctx.fill(); } ctx.fillStyle = '#c0673c'; ctx.beginPath(); ctx.arc(0, 0, s * 0.45, 0, 7); ctx.fill(); ctx.fillStyle = '#5b3a1e'; ctx.beginPath(); ctx.arc(0, 0, s * 0.33, 0, 7); ctx.fill(); },
  chair(s, c) { ctx.fillStyle = '#8b5a2b'; rr(-s * 0.75, -s * 0.75, s * 1.5, s * 1.5, s * 0.2); ctx.fill(); ctx.fillStyle = c; rr(-s * 0.6, -s * 0.45, s * 1.2, s * 1.05, s * 0.2); ctx.fill(); ctx.fillStyle = '#6b4420'; rr(-s * 0.8, -s * 0.85, s * 1.6, s * 0.35, s * 0.15); ctx.fill(); },
  lamp(s) { ctx.fillStyle = 'rgba(255,230,120,0.25)'; ctx.beginPath(); ctx.arc(0, 0, s * 1.15, 0, 7); ctx.fill(); ctx.fillStyle = '#fff1b8'; ctx.beginPath(); ctx.arc(0, 0, s * 0.85, 0, 7); ctx.fill(); ctx.strokeStyle = '#e0c060'; ctx.lineWidth = s * 0.1; ctx.stroke(); ctx.fillStyle = '#c9a43b'; ctx.beginPath(); ctx.arc(0, 0, s * 0.18, 0, 7); ctx.fill(); },
  bin(s) { ctx.fillStyle = '#7f8c8d'; ctx.beginPath(); ctx.arc(0, 0, s * 0.85, 0, 7); ctx.fill(); ctx.fillStyle = '#4b5557'; ctx.beginPath(); ctx.arc(0, 0, s * 0.65, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; rr(-s * 0.3, -s * 0.2, s * 0.4, s * 0.3, 2); ctx.fill(); },
  table(s) { ctx.fillStyle = 'rgba(0,0,0,0.15)'; rr(-s + 4, -s * 0.7 + 5, s * 2, s * 1.4, s * 0.15); ctx.fill(); ctx.fillStyle = '#a0662f'; rr(-s, -s * 0.7, s * 2, s * 1.4, s * 0.15); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(-s * 0.9, i * s * 0.22); ctx.lineTo(s * 0.9, i * s * 0.22); ctx.stroke(); } ctx.fillStyle = '#fff'; [[-0.5, 0], [0.5, 0]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x * s, y * s, s * 0.25, 0, 7); ctx.fill(); }); },
  tv(s) { ctx.fillStyle = '#222'; rr(-s, -s * 0.35, s * 2, s * 0.7, s * 0.1); ctx.fill(); ctx.fillStyle = '#3a6ea5'; rr(-s * 0.9, -s * 0.25, s * 1.8, s * 0.32, s * 0.05); ctx.fill(); ctx.fillStyle = '#555'; rr(-s * 0.4, s * 0.15, s * 0.8, s * 0.35, s * 0.1); ctx.fill(); },
  armchair(s, c) { ctx.fillStyle = c; rr(-s * 0.9, -s * 0.9, s * 1.8, s * 1.8, s * 0.35); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(-s * 0.55, -s * 0.4, s * 1.1, s * 1.1, s * 0.25); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.15)'; rr(-s * 0.9, -s * 0.9, s * 1.8, s * 0.45, s * 0.3); ctx.fill(); },
  fridge(s) { ctx.fillStyle = '#e8eef3'; rr(-s * 0.75, -s, s * 1.5, s * 2, s * 0.15); ctx.fill(); ctx.strokeStyle = '#b5c2cc'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#9aa8b3'; ctx.fillRect(s * 0.45, -s * 0.6, s * 0.12, s * 0.5); ctx.beginPath(); ctx.moveTo(-s * 0.75, -s * 0.2); ctx.lineTo(s * 0.75, -s * 0.2); ctx.stroke(); },
  sofa(s, c) { ctx.fillStyle = 'rgba(0,0,0,0.15)'; rr(-s + 5, -s * 0.5 + 6, s * 2, s, s * 0.25); ctx.fill(); ctx.fillStyle = c; rr(-s, -s * 0.5, s * 2, s, s * 0.25); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.18)'; rr(-s, -s * 0.5, s * 2, s * 0.32, s * 0.2); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.22)'; for (let i = 0; i < 3; i++) { rr(-s * 0.85 + i * s * 0.58, -s * 0.12, s * 0.52, s * 0.52, s * 0.1); ctx.fill(); } },
  bed(s, c) { ctx.fillStyle = '#8b5a2b'; rr(-s * 0.75, -s, s * 1.5, s * 2, s * 0.12); ctx.fill(); ctx.fillStyle = '#fff'; rr(-s * 0.65, -s * 0.9, s * 1.3, s * 1.8, s * 0.1); ctx.fill(); ctx.fillStyle = c; rr(-s * 0.65, -s * 0.25, s * 1.3, s * 1.15, s * 0.1); ctx.fill(); ctx.fillStyle = '#eef'; rr(-s * 0.55, -s * 0.82, s * 0.5, s * 0.35, s * 0.1); ctx.fill(); rr(s * 0.05, -s * 0.82, s * 0.5, s * 0.35, s * 0.1); ctx.fill(); },
  piano(s) { ctx.fillStyle = '#1b1b1b'; rr(-s, -s * 0.6, s * 2, s * 1.2, s * 0.12); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(-s * 0.9, s * 0.2, s * 1.8, s * 0.3); ctx.fillStyle = '#111'; for (let i = 0; i < 12; i++) if (i % 7 !== 2 && i % 7 !== 6) ctx.fillRect(-s * 0.85 + i * s * 0.15, s * 0.2, s * 0.07, s * 0.17); },
  car(s, c) { ctx.fillStyle = 'rgba(0,0,0,0.2)'; rr(-s + 5, -s * 0.5 + 6, s * 2, s, s * 0.35); ctx.fill(); ctx.fillStyle = c; rr(-s, -s * 0.5, s * 2, s, s * 0.35); ctx.fill(); ctx.fillStyle = '#bfe3ff'; rr(-s * 0.35, -s * 0.38, s * 0.3, s * 0.76, s * 0.1); ctx.fill(); rr(s * 0.25, -s * 0.38, s * 0.35, s * 0.76, s * 0.1); ctx.fill(); ctx.fillStyle = '#ffe28a'; ctx.beginPath(); ctx.arc(s * 0.9, -s * 0.3, s * 0.08, 0, 7); ctx.arc(s * 0.9, s * 0.3, s * 0.08, 0, 7); ctx.fill(); },
};

let objs, rugs, totalArea, eatenArea, P, timeLeft, state, t, popups, crumbs, joy, endT, zoom;

function buildWorld() {
  objs = []; rugs = [];
  for (let i = 0; i < 6; i++) rugs.push({ x: rnd(150, WS - 150), y: rnd(150, WS - 150), w: rnd(220, 380), h: rnd(160, 300), c: pick(['#d4a5a5', '#a5c4d4', '#c9d4a5', '#d4c4a5', '#bca5d4']), round: Math.random() < 0.5 });
  const placed = [];
  for (let ti = TIERS.length - 1; ti >= 0; ti--) {
    const tier = TIERS[ti];
    for (let k = 0; k < tier.n; k++) {
      const s = rnd(tier.s[0], tier.s[1]);
      let x, y, tries = 0;
      do { x = rnd(60 + s, WS - 60 - s); y = rnd(60 + s, WS - 60 - s); tries++; }
      while (tries < 40 && (Math.hypot(x - WS / 2, y - WS / 2) < 90 || placed.some(o => Math.hypot(o.x - x, o.y - y) < (o.s + s) * 0.95)));
      const o = { x, y, s, type: pick(tier.types), c: pick(COLORS), a: ti >= 3 ? pick([0, Math.PI / 2, Math.PI, -Math.PI / 2]) + rnd(-0.1, 0.1) : rnd(0, 6.28), eaten: false, anim: 0 };
      objs.push(o); placed.push(o);
    }
  }
  totalArea = objs.reduce((a, o) => a + Math.pow(o.s, 1.5), 0);
}

function startGame() {
  buildWorld();
  P = { x: WS / 2, y: WS / 2, R: 13, vx: 0, vy: 0, look: 0, squish: 0 };
  eatenArea = 0; timeLeft = ROUND; state = 'play'; popups = []; crumbs = []; endT = 0; zoom = 1.3;
}

// ---------- input ----------
joy = { active: false, ax: 0, ay: 0, x: 0, y: 0 };
const keys = {};
cv.addEventListener('pointerdown', e => {
  const p = toGame(e);
  if (state !== 'play') { if (state === 'menu' || endT > 0.8) startGame(); return; }
  joy.active = true; joy.ax = p.x; joy.ay = p.y; joy.x = p.x; joy.y = p.y;
});
cv.addEventListener('pointermove', e => { if (!joy.active) return; const p = toGame(e); joy.x = p.x; joy.y = p.y; });
addEventListener('pointerup', () => joy.active = false);
addEventListener('pointercancel', () => joy.active = false);
addEventListener('keydown', e => { keys[e.key] = true; if (state !== 'play' && (e.key === ' ' || e.key === 'Enter')) startGame(); });
addEventListener('keyup', e => keys[e.key] = false);

function popup(txt, x, y, color) { popups.push({ txt, x, y, color, life: 0.9 }); }

// ---------- update ----------
function update(dt) {
  t += dt;
  popups.forEach(p => { p.y -= 40 * dt; p.life -= dt; }); popups = popups.filter(p => p.life > 0);
  crumbs.forEach(c => { c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.92; c.vy *= 0.92; c.life -= dt; }); crumbs = crumbs.filter(c => c.life > 0);
  if (state === 'over') { endT += dt; return; }
  if (state !== 'play') return;

  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0; state = 'over'; endT = 0;
    const pct = eatenArea / totalArea * 100;
    if (pct > best) { best = pct; try { localStorage.setItem('slime_best', best); } catch (e) {} }
    return;
  }

  let mx = 0, my = 0;
  if (joy.active) {
    const dx = joy.x - joy.ax, dy = joy.y - joy.ay, d = Math.hypot(dx, dy);
    if (d > 4) { const m = Math.min(1, d / 55); mx = dx / d * m; my = dy / d * m; }
  }
  if (keys.ArrowLeft) mx -= 1; if (keys.ArrowRight) mx += 1; if (keys.ArrowUp) my -= 1; if (keys.ArrowDown) my += 1;
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  const speed = 170 + P.R * 2.2;
  P.vx += (mx * speed - P.vx) * Math.min(1, dt * 8);
  P.vy += (my * speed - P.vy) * Math.min(1, dt * 8);
  P.x += P.vx * dt; P.y += P.vy * dt;
  if (ml > 0.1) P.look = Math.atan2(my, mx);
  P.x = clamp(P.x, P.R, WS - P.R); P.y = clamp(P.y, P.R, WS - P.R);
  P.squish = Math.max(0, P.squish - dt * 3);

  for (const o of objs) {
    if (o.eaten) { if (o.anim < 1) o.anim += dt / 0.25; continue; }
    const dx = o.x - P.x, dy = o.y - P.y;
    if (Math.abs(dx) > P.R + o.s + 4 || Math.abs(dy) > P.R + o.s + 4) continue;
    const d = Math.hypot(dx, dy);
    if (P.R > o.s * 1.1) {
      if (d < P.R * 0.92 + o.s * 0.2) {
        o.eaten = true; o.anim = 0; o.ex = o.x; o.ey = o.y;
        eatenArea += Math.pow(o.s, 1.5);
        P.R = Math.sqrt(P.R * P.R + o.s * o.s * 0.42);
        P.squish = 1;
        if (o.s > 14) popup('+' + Math.round(o.s), P.x, P.y - P.R - 10, '#ffffff');
        for (let i = 0; i < Math.min(10, 2 + o.s / 4); i++) { const a = rnd(0, 7), sp = rnd(40, 160); crumbs.push({ x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.6), c: o.c, r: rnd(1.5, 3.5) }); }
      }
    } else {
      const min = P.R * 0.85 + o.s * 0.85;
      if (d < min && d > 0.01) { P.x -= dx / d * (min - d); P.y -= dy / d * (min - d); }
    }
  }
  const zt = W / (P.R * 9 + 230);
  zoom += (zt - zoom) * Math.min(1, dt * 2);
}

// ---------- draw ----------
function drawSlime(x, y, R) {
  const N = 28, pts = [];
  const sq = P.squish;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    const wob = 1 + 0.045 * Math.sin(t * 5 + i * 1.3) + 0.03 * Math.sin(t * 3.1 - i * 2.1) + sq * 0.08 * Math.sin(i * 3 + t * 20);
    pts.push([x + Math.cos(a) * R * wob, y + Math.sin(a) * R * wob]);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(x + R * 0.1, y + R * 0.15, R, R * 0.95, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.1, x, y, R * 1.05);
  g.addColorStop(0, '#b6ff8f'); g.addColorStop(0.6, '#5fd84a'); g.addColorStop(1, '#2fa83b');
  ctx.fillStyle = g; ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const p0 = pts[i % N], p1 = pts[(i + 1) % N];
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(p0[0], p0[1], mx, my);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1f8a33'; ctx.lineWidth = Math.max(1.5, R * 0.06); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(x - R * 0.4, y - R * 0.45, R * 0.22, R * 0.13, -0.6, 0, 7); ctx.fill();
  const lx = Math.cos(P.look), ly = Math.sin(P.look);
  for (const s of [-1, 1]) {
    const ex = x + lx * R * 0.3 - ly * s * R * 0.28, ey = y + ly * R * 0.3 + lx * s * R * 0.28 - R * 0.1;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, R * 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1a2e'; ctx.beginPath(); ctx.arc(ex + lx * R * 0.07, ey + ly * R * 0.07, R * 0.1, 0, 7); ctx.fill();
  }
  const mxp = x + lx * R * 0.55, myp = y + ly * R * 0.55 - R * 0.05;
  ctx.fillStyle = '#145c22'; ctx.beginPath(); ctx.ellipse(mxp, myp, R * (0.12 + sq * 0.1), R * (0.07 + sq * 0.12), P.look, 0, 7); ctx.fill();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#2d1e3a'; ctx.fillRect(0, 0, vw, vh);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(-ox / scale, -oy / scale, vw / scale, vh / scale); ctx.clip();

  if (state === 'menu') { drawMenu(); ctx.restore(); return; }

  // world transform
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-P.x, -P.y);
  ctx.fillStyle = '#4a3557'; ctx.fillRect(-2000, -2000, WS + 4000, WS + 4000);
  ctx.fillStyle = '#e8c89a'; ctx.fillRect(0, 0, WS, WS);
  ctx.strokeStyle = 'rgba(150,100,50,0.18)'; ctx.lineWidth = 2;
  for (let y = 0; y < WS; y += 46) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WS, y); ctx.stroke();
    for (let x = ((y / 46) % 3) * 70; x < WS; x += 210) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 46); ctx.stroke(); }
  }
  for (const r of rugs) {
    ctx.fillStyle = r.c;
    if (r.round) { ctx.beginPath(); ctx.ellipse(r.x, r.y, r.w / 2, r.h / 2, 0, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.w / 2 - 14, r.h / 2 - 14, 0, 0, 7); ctx.stroke(); }
    else { rr(r.x - r.w / 2, r.y - r.h / 2, r.w, r.h, 12); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 6; rr(r.x - r.w / 2 + 14, r.y - r.h / 2 + 14, r.w - 28, r.h - 28, 8); ctx.stroke(); }
  }
  ctx.strokeStyle = '#7a5a8a'; ctx.lineWidth = 24; ctx.strokeRect(-12, -12, WS + 24, WS + 24);

  const viewR = (Math.max(W, H) / 2) / zoom + 80;
  for (const o of objs) {
    if (o.eaten && o.anim >= 1) continue;
    if (Math.abs(o.x - P.x) > viewR || Math.abs(o.y - P.y) > viewR) continue;
    ctx.save();
    if (o.eaten) {
      const k = Math.min(1, o.anim);
      ctx.translate(o.ex + (P.x - o.ex) * k, o.ey + (P.y - o.ey) * k); ctx.rotate(o.a + k * 4); ctx.scale(1 - k, 1 - k);
    } else { ctx.translate(o.x, o.y); ctx.rotate(o.a); }
    DRAW[o.type](o.s, o.c);
    if (!o.eaten && P.R > o.s * 1.1 && o.s > 14) { ctx.strokeStyle = 'rgba(80,220,90,0.7)'; ctx.lineWidth = 3 / zoom; ctx.beginPath(); ctx.arc(0, 0, o.s * 1.15, 0, 7); ctx.stroke(); }
    ctx.restore();
  }
  for (const c of crumbs) { ctx.globalAlpha = clamp(c.life * 2, 0, 1); ctx.fillStyle = c.c; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawSlime(P.x, P.y, P.R);
  for (const p of popups) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); text(p.txt, p.x, p.y, 20 / zoom, p.color, 'center', '#1f8a33'); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // joystick
  if (joy.active && state === 'play') {
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.arc(joy.ax, joy.ay, 55, 0, 7); ctx.fill();
    const dx = joy.x - joy.ax, dy = joy.y - joy.ay, d = Math.hypot(dx, dy), m = Math.min(1, 55 / Math.max(d, 1));
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(joy.ax + dx * m, joy.ay + dy * m, 24, 0, 7); ctx.fill();
  }

  // HUD
  const pct = eatenArea / totalArea * 100;
  rr(14, 14, 96, 44, 22); ctx.fillStyle = timeLeft < 10 ? '#e74c3c' : 'rgba(30,20,40,0.75)'; ctx.fill();
  const tl = Math.ceil(timeLeft);
  text(Math.floor(tl / 60) + ':' + String(tl % 60).padStart(2, '0'), 62, 37, 22, '#fff');
  rr(124, 22, 282, 28, 14); ctx.fillStyle = 'rgba(30,20,40,0.75)'; ctx.fill();
  if (pct > 0) { rr(128, 26, 274 * Math.min(1, pct / 100), 20, 10); ctx.fillStyle = '#5fd84a'; ctx.fill(); }
  [25, 50, 80].forEach(v => { ctx.fillStyle = pct >= v ? '#ffd23f' : 'rgba(255,255,255,0.35)'; ctx.fillRect(128 + 274 * v / 100 - 1, 24, 2, 24); });
  text(Math.floor(pct) + '% EATEN', 265, 37, 14, '#fff');
  text('Size ' + Math.round(P.R), W / 2, 74, 15, '#fff', 'center', 'rgba(0,0,0,0.4)');

  if (state === 'over') drawOver(pct);
  ctx.restore();
}

function star(x, y, r, on) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = on ? '#ffc93c' : 'rgba(0,0,0,0.15)'; ctx.fill();
  if (on) { ctx.strokeStyle = '#e09b00'; ctx.lineWidth = 3; ctx.stroke(); }
}

function drawOver(pct) {
  const a = clamp(endT * 3, 0, 1);
  ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#1a1024'; ctx.fillRect(-ox / scale, -oy / scale, vw / scale, vh / scale);
  ctx.globalAlpha = a;
  const y = 220 + (1 - a) * 30;
  rr(40, y, 340, 300, 28); ctx.fillStyle = '#fff'; ctx.fill();
  text("TIME'S UP!", W / 2, y + 50, 34, '#2fa83b');
  text('You ate ' + Math.floor(pct) + '% of the house', W / 2, y + 95, 18, '#4a3b5a', 'center', null, 700);
  const stars = pct >= 80 ? 3 : pct >= 50 ? 2 : pct >= 25 ? 1 : 0;
  for (let i = 0; i < 3; i++) star(W / 2 - 70 + i * 70, y + 150, i === 1 ? 32 : 26, i < stars);
  text('Best: ' + Math.floor(best) + '%', W / 2, y + 200, 15, '#8a7a9a', 'center', null, 700);
  const pulse = 1 + Math.sin(t * 5) * 0.03;
  ctx.save(); ctx.translate(W / 2, y + 252); ctx.scale(pulse, pulse);
  rr(-110, -26, 220, 52, 26); ctx.fillStyle = '#2fae5a'; ctx.fill();
  text('PLAY AGAIN', 0, 1, 20, '#fff'); ctx.restore();
  ctx.globalAlpha = 1;
}

function drawMenu() {
  ctx.fillStyle = '#e8c89a'; ctx.fillRect(-ox / scale, -oy / scale, vw / scale, vh / scale);
  ctx.save(); ctx.translate(70, 610); ctx.rotate(0.3); DRAW.sofa(55, '#9b59b6'); ctx.restore();
  ctx.save(); ctx.translate(360, 140); DRAW.plant(24); ctx.restore();
  ctx.save(); ctx.translate(60, 120); DRAW.ball(14, '#e74c3c'); ctx.restore();
  ctx.save(); ctx.translate(350, 640); ctx.rotate(-0.4); DRAW.book(14, '#3498db'); ctx.restore();
  ctx.save(); ctx.translate(370, 470); DRAW.coin(7); ctx.restore();
  ctx.save(); ctx.translate(50, 420); DRAW.candy(8, '#ff6b9a'); ctx.restore();
  text('SLIME', W / 2, 160, 74, '#7cf05e', 'center', '#1f8a33');
  text('EATER', W / 2, 235, 64, '#ffffff', 'center', '#1f8a33');
  P = P || { look: 0.3, squish: 0 };
  P.look = Math.sin(t) * 0.8 + 1.57; P.squish = 0;
  drawSlime(W / 2, 380, 62 + Math.sin(t * 3) * 3);
  text('Drag to move. Eat smaller things.', W / 2, 490, 17, '#4a3557', 'center', null, 700);
  text('Grow until you can eat the whole house!', W / 2, 516, 17, '#4a3557', 'center', null, 700);
  const pulse = 1 + Math.sin(t * 5) * 0.04;
  ctx.save(); ctx.translate(W / 2, 610); ctx.scale(pulse, pulse);
  rr(-120, -30, 240, 60, 30); ctx.fillStyle = '#2fae5a'; ctx.fill();
  text('TAP TO PLAY', 0, 1, 24, '#fff'); ctx.restore();
  if (best > 0) text('Best: ' + Math.floor(best) + '%', W / 2, 680, 16, '#4a3557', 'center', null, 700);
}

state = 'menu'; t = 0; P = null; popups = []; crumbs = [];
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
